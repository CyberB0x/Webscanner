<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Security Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function showLoading() {
            document.getElementById("loading").style.display = "block";
        }
    </script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="mb-4">🔍 Web Security Scanner</h1>
    <form method="post" onsubmit="showLoading()">
        {% csrf_token %}
        <div class="mb-3">
            <label for="url" class="form-label">Enter URL to scan:</label>
            <input type="url" name="url" id="url" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Start Scan</button>
    </form>

    <!-- Индикатор загрузки -->
    <div id="loading" class="mt-4" style="display:none;">
        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated"
                 role="progressbar" style="width: 100%">Scanning...</div>
        </div>
    </div>
</div>
</body>
</html>
